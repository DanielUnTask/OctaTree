name: Release

# Pushing a tag like v0.1.0 builds the binaries and publishes a GitHub release.
# Asset names (octatree-<version>-<os>-<arch>.zip) follow what Rokit looks for,
# so `rokit add danieluntask/octatree` installs the right one automatically.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the Cargo.toml version
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v${cargo_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${cargo_version}"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64 }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-aarch64 }
          - { runner: macos-latest, target: aarch64-apple-darwin, platform: macos-aarch64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, platform: macos-x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="octatree-${version}-${{ matrix.platform }}"
          bin="octatree"
          if [ "${RUNNER_OS}" = "Windows" ]; then bin="octatree.exe"; fi
          mkdir staging
          cp "target/${{ matrix.target }}/release/${bin}" staging/
          cp LICENSE README.md staging/
          cd staging
          if [ "${RUNNER_OS}" = "Windows" ]; then
            7z a -tzip "../${name}.zip" ./*
          else
            zip -r "../${name}.zip" ./*
          fi
      - name: Smoke test (native binaries only)
        if: matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          bin="octatree"
          if [ "${RUNNER_OS}" = "Windows" ]; then bin="octatree.exe"; fi
          "staging/${bin}" --version
      - uses: actions/upload-artifact@v4
        with:
          name: octatree-${{ matrix.platform }}
          path: octatree-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: octatree-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.zip > checksums.txt && cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
