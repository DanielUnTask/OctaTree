[package]
name = "octatree"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Rojo project tree generator: routes Luau sources into containers and writes default.project.json"
license = "MIT"
repository = "https://github.com/DanielUnTask/OctaTree"
readme = "README.md"
keywords = ["roblox", "rojo", "luau", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[lib]
path = "lib/lib.rs"

[[bin]]
name = "octatree"
path = "lib/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
globset = "0.4.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
toml = { version = "1.2.2", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
