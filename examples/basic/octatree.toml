# Demo configuration for a project created with `rojo init`.
# From the repository root: octatree generate --root examples/basic
version = 1

project_name = "Basic"
modules = ["client", "server", "shared", "gameplay"]

# Files without a suffix and without a rule go to BOTH client and server.
default_to = ["client", "server"]

ignore = ["**/*.spec.luau"]

[containers.shared]
mount = "ReplicatedStorage"

[containers.server]
mount = "ServerScriptService"

[containers.client]
mount = "StarterPlayer/StarterPlayerScripts"

# Name endings decide the container (case-insensitive). The first match wins.
[[suffix_rules]]
suffix = ["server", "service"]
to = ["server"]

[[suffix_rules]]
suffix = ["client"]
to = ["client"]

# The Rojo starter folders: src/client and src/server hold init scripts
# (mounted as one node each); src/shared is replicated to everyone.
[[rules]]
match = "src/client"
to = ["client"]

[[rules]]
match = "src/server"
to = ["server"]

[[rules]]
match = "src/shared"
to = ["shared"]

# Keep the settings of the default Rojo project.
[nodes.Workspace]
class_name = "Workspace"
properties = { FilteringEnabled = true }

[nodes."Workspace/Baseplate"]
class_name = "Part"
properties = { Anchored = true, Color = [0.38823, 0.37254, 0.38823], Locked = true, Position = [0, -10, 0], Size = [512, 20, 512] }

[nodes.Lighting]
class_name = "Lighting"
properties = { Ambient = [0, 0, 0], Brightness = 2, GlobalShadows = true, Outlines = false, Technology = "Voxel" }

[nodes.SoundService]
class_name = "SoundService"
properties = { RespectFilteringEnabled = true }
